<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ครูๆ — ครู</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Press+Start+2P&display=swap');

:root {
  --bg: #f4f7f5;
  --surface: #ffffff;
  --text: #17211c;
  --muted: #59665f;
  --line: #d7e1da;
  --primary: #067a3b;
  --primary-ink: #ffffff;
  --danger: #b42318;
  --warning: #8a4b08;
  --success: #176b3a;
  --info: #174ea6;
  --rarity-common: #e8edf0;
  --rarity-rare: #dbeafe;
  --rarity-special: #f3e8ff;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5rem;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --radius: 14px;
  --shadow: 0 3px 12px rgba(18, 43, 29, .08);
  font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 16px;
}
* { box-sizing: border-box; }
html { min-width: 320px; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
body.test-mode::before {
  content: "โหมดทดสอบ — ข้อมูลไม่ใช่ของจริง";
  display: block; position: sticky; top: 0; z-index: 20;
  padding: .65rem 1rem; text-align: center; font-weight: 700;
  color: #542900; background: #ffcc80; border-bottom: 2px solid #a65b00;
}
a { color: var(--primary); }
button, input, textarea, select { font: inherit; }
button, .button {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: 44px; padding: .65rem 1rem; border: 1px solid var(--primary);
  border-radius: 11px; background: var(--primary); color: var(--primary-ink);
  font-weight: 700; text-align: center; cursor: pointer; text-decoration: none;
}
button:disabled, .button:disabled { opacity: .62; cursor: not-allowed; }
button.secondary, .button.secondary { background: #fff; color: var(--primary); border-color: #8aa998; }
button.danger, .button.danger { background: #fff; color: var(--danger); border-color: #d6a09c; }
button.big, .button.big { width: 100%; min-height: 76px; font-size: var(--fs-lg); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid #1459c7; outline-offset: 3px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
label { display: flex; flex-direction: column; gap: .35rem; font-weight: 600; min-width: 0; }
label input, label textarea, label select {
  width: 100%; min-width: 0; min-height: 44px; padding: .65rem .75rem;
  color: var(--text); background: #fff; border: 1px solid #9eafa4; border-radius: 10px;
}
textarea { min-height: 100px; resize: vertical; }
label.radio { display: flex; flex-direction: row; align-items: center; gap: .55rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
label.radio input { width: 20px; height: 20px; min-height: 20px; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); margin: 0 0 var(--space-4); min-width: 0; }
legend { font-weight: 700; padding: 0 .4rem; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.25; }
h2 { font-size: var(--fs-lg); margin-bottom: .7rem; }
h3 { font-size: var(--fs-md); margin-bottom: .4rem; }
p { margin-bottom: .75rem; }
header.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem clamp(1rem, 3vw, 2rem); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 1.1rem; }
main, #main { width: 100%; min-width: 0; }
.page { width: min(100% - 2rem, 1100px); margin: 1.25rem auto 2rem; }
.page.narrow { max-width: 540px; }
#status { margin: 0 0 1rem; padding: .8rem 1rem; border: 1px solid #9cb8d0; border-radius: 12px; background: #edf5ff; color: #163d69; font-weight: 600; }
#status::before { content: ""; display: inline-block; width: 1.1em; height: 1.1em; margin-right: .45rem; vertical-align: -.2em; background: currentColor; -webkit-mask: var(--i-info) center / contain no-repeat; mask: var(--i-info) center / contain no-repeat; }
#status.ok { color: #15552f; background: #eaf7ee; border-color: #8ec8a1; }
#status.ok::before { -webkit-mask-image: var(--i-ok); mask-image: var(--i-ok); }
#status.error { color: #8e1c14; background: #fff0ef; border-color: #d99a95; }
#status.error::before { -webkit-mask-image: var(--i-error); mask-image: var(--i-error); }
.notice { padding: .8rem 1rem; margin: 0 0 1rem; border-radius: 12px; background: #fff7df; border: 1px solid #e5c979; color: #654300; font-weight: 600; }
.card, section { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.card h2, .card h3 { margin-top: 0; }
.badge { display: inline-flex; align-items: center; gap: .25rem; border-radius: 999px; padding: .2rem .6rem; font-size: var(--fs-sm); font-weight: 700; background: #e8eee9; color: #34483b; border: 1px solid #c6d4ca; }
.badge.success { background: #eaf7ee; color: #15552f; }
.badge.warning { background: #fff4d8; color: #704300; }
.badge.danger { background: #fff0ef; color: #8e1c14; }
.muted { color: var(--muted); font-size: var(--fs-sm); }
.prompt { padding: .75rem; background: #f0f7f2; border-left: 4px solid var(--primary); border-radius: 8px; font-weight: 700; }
.done { color: var(--success); font-weight: 700; }
.flags { border: 2px solid #b42318; background: #fff1f0; border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
.flags h2 { color: #8e1c14; }
.warn { background: #fff7df; color: #654300; border: 1px solid #e5c979; border-radius: 12px; padding: .8rem 1rem; margin-bottom: 1rem; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin: 1rem 0; }
.stats > div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .8rem; }
.stats strong { display: block; font-size: var(--fs-xl); }
.empty { border: 1px dashed #9eafa4; border-radius: 12px; padding: 1.25rem; color: var(--muted); text-align: center; background: #fff; }
.skeleton { border-radius: 10px; background: linear-gradient(90deg, #e7ece8, #f7f9f7, #e7ece8); min-height: 48px; margin: .5rem 0; }
.tabs { display: flex; gap: .5rem; overflow-x: auto; padding: .2rem 0 .75rem; }
.tabs button { flex: 0 0 auto; background: #fff; color: var(--text); border-color: var(--line); }
.tabs button[aria-selected="true"] { background: #eaf7ee; color: #15552f; border-color: var(--primary); box-shadow: inset 0 -3px var(--primary); }
.bottom-nav { position: sticky; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .25rem; padding: .45rem; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; text-decoration: none; color: #34483b; font-size: .78rem; font-weight: 600; }
.bottom-nav a[aria-current="page"] { background: #eaf7ee; color: #15552f; }
.layout { display: grid; grid-template-columns: 245px minmax(0, 1fr); min-height: 100vh; }
.sidebar { padding: 1rem; background: #fff; border-right: 1px solid var(--line); }
.sidebar nav { display: grid; gap: .35rem; }
.sidebar a { display: flex; gap: .6rem; align-items: center; min-height: 44px; padding: .6rem .7rem; color: var(--text); text-decoration: none; border-radius: 9px; }
.sidebar a[aria-current="page"] { background: #eaf7ee; color: #15552f; font-weight: 700; }
.content { padding: 1.5rem; min-width: 0; }
.table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: var(--fs-sm); }
th, td { padding: .7rem .8rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: #f0f5f1; font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.thumb { display: inline-flex; width: 76px; height: 76px; align-items: center; justify-content: center; background: #edf1ee; border: 1px dashed #9eafa4; border-radius: 10px; color: var(--muted); object-fit: cover; }
.chooser { max-width: 480px; margin: 2rem auto; padding: 1rem; }
.aar-step { border-left: 4px solid var(--primary); padding-left: 1rem; margin: 1rem 0; }
.toast { background: #15552f; color: #fff; border-radius: 10px; padding: .75rem 1rem; box-shadow: var(--shadow); }
.diag { margin: 1.5rem auto; width: min(100% - 2rem, 1100px); color: var(--muted); font-size: .75rem; }
.diag summary { cursor: pointer; }
.diag-error { color: var(--danger); }
hr { border: 0; border-top: 1px solid var(--line); margin: 1rem 0; }
@media (min-width: 700px) {
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .student-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: start; }
}
@media (max-width: 800px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
  .sidebar nav { display: flex; overflow-x: auto; }
  .sidebar a { flex: 0 0 auto; }
  .content { padding: 1rem; }
  header.topbar { align-items: flex-start; }
  .page { width: min(100% - 1.25rem, 1100px); margin-top: .8rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .celebrate { animation: celebrate .55s ease-out; }
  @keyframes celebrate { 0% { transform: scale(.98); } 55% { transform: scale(1.015); } 100% { transform: scale(1); } }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

/* ---- ส่วนเพิ่มตอนนำไปต่อกับระบบ (Claude) ---- */
[hidden] { display: none !important; }
.layout.no-menu { grid-template-columns: minmax(0, 1fr); }
.card.rarity-common { background: var(--rarity-common); }
.card.rarity-rare { background: var(--rarity-rare); border-color: #93b4e8; }
.card.rarity-special { background: var(--rarity-special); border-color: #c4a3e6; }
.chooser { display: grid; gap: var(--space-3); }
img.thumb { display: block; }
img.thumb.full { width: auto; height: auto; max-width: 100%; max-height: 480px; }
td { white-space: pre-line; }
.row > h1 { margin: 0 auto 0 0; }
.aar { border-top: 1px dashed var(--line); margin-top: var(--space-4); padding-top: var(--space-3); }
.sidebar a .badge { margin-left: auto; }
label > span { font-weight: 600; }
.diag #diag > div { word-break: break-all; }
/* แถบล่างนักเรียนติดขอบล่างจอเสมอ */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; }
body:has(.bottom-nav:not([hidden])) { padding-bottom: 76px; }
/* toast ผลสำเร็จ ลอยเหนือแถบล่าง */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; z-index: 40; max-width: min(92vw, 520px); }

/* ---- ไอคอนเส้นบาง (src/client/icons.ts) + โทน iOS ---- */
:root {
  --i-info: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'9'%2F%3E%3Cpath%20d%3D'M12%2011v5.5M12%207.5h.01'%2F%3E%3C%2Fsvg%3E");
  --i-ok: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Ccircle%20cx%3D'12'%20cy%3D'12'%20r%3D'9'%2F%3E%3Cpath%20d%3D'm8%2012.3%202.7%202.7L16.5%209'%2F%3E%3C%2Fsvg%3E");
  --i-error: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'2'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M10.3%204.3%202.8%2017.5A2%202%200%200%200%204.5%2020.5h15a2%202%200%200%200%201.7-3L13.7%204.3a2%202%200%200%200-3.4%200z'%2F%3E%3Cpath%20d%3D'M12%209.5v4.5M12%2017h.01'%2F%3E%3C%2Fsvg%3E");
}
.icon { display: inline-flex; width: 1.25em; height: 1.25em; flex: 0 0 auto; vertical-align: -.25em; }
.icon svg { width: 100%; height: 100%; }
.brand { display: inline-flex; align-items: center; gap: .45rem; }
.brand .icon { color: var(--primary); }
h2 .icon { color: var(--danger); }
button .icon, .button .icon { width: 1.2em; height: 1.2em; }
button.big .icon { width: 28px; height: 28px; }
/* แถบล่างแบบ iOS: โปร่งเบลอ ไอคอนบน ป้ายล่าง เลือกแล้วเป็นสีหลัก (ไม่มีกล่อง) */
.bottom-nav { background: rgba(255,255,255,.82); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-top: .5px solid rgba(0,0,0,.18); padding: .35rem .5rem calc(.35rem + env(safe-area-inset-bottom)); }
.bottom-nav a { gap: 2px; color: #8a8f8c; font-size: .7rem; font-weight: 500; }
.bottom-nav a .icon { width: 26px; height: 26px; }
.bottom-nav a[aria-current="page"] { background: transparent; color: var(--primary); }
.sidebar a .icon { width: 20px; height: 20px; color: var(--muted); }
.sidebar a[aria-current="page"] .icon { color: var(--primary); }
#status.celebrate::before { display: none; }
#status.celebrate .icon { margin-right: .4rem; }
.done .icon, .tabs .icon { color: var(--success); }

/* ---- แก้จากผลทดสอบ UI รอบ 2 ---- */
#toast { top: calc(env(safe-area-inset-top) + 12px); bottom: auto; }
body.test-mode #toast { top: 52px; }
/* เมนูครูติดจอ */
@media (min-width: 801px) {
  .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
}
@media (max-width: 800px) {
  .sidebar { position: sticky; top: 0; z-index: 15; }
}
/* ช่องตรวจงาน */
.grade { display: grid; gap: .5rem; min-width: 220px; }
.grade input { max-width: 8rem; }
/* แถบล่าง: ป้ายอ่านง่ายขึ้น และไม่กว้างเกินบนจอใหญ่ */
.bottom-nav a { font-size: .75rem; }
@media (min-width: 600px) {
  .bottom-nav { max-width: 540px; margin: 0 auto; border-radius: 18px 18px 0 0; }
  .bottom-nav a { font-size: .85rem; }
}

/* หน้านักเรียนบนจอคอม: แสดงกว้างเท่ามือถือ (ใช้ในแอป LINE เป็นหลัก) */
@media (min-width: 600px) {
  html:has(body.student-app) { background: #dfe6e1; }
  body.student-app { max-width: 420px; margin: 0 auto; min-height: 100vh; border-left: 1px solid var(--line); border-right: 1px solid var(--line); box-shadow: 0 0 40px rgba(18, 43, 29, .12); }
  body.student-app .bottom-nav { max-width: 420px; border-radius: 0; }
  body.student-app .page.narrow { width: calc(100% - 2rem); }
  body.student-app .bottom-nav a { font-size: .75rem; }
}

/* ---- การ์ดทาโรต์ 8-bit (2026-10-26) ---- */
.pixel-card {
  --sky-top: #2a7f8f; --sky-mid: #4fb3c2; --sky-low: #a9dfe6; --ink: #1d1d1d; --num: #fff4c2;
  background: #fff; border: 4px solid var(--ink); border-radius: 6px; padding: 6px 6px .75rem;
  box-shadow: 4px 4px 0 rgba(0, 0, 0, .25); margin-bottom: 1rem; min-width: 0;
}
.pixel-card.rarity-rare { --sky-top: #3b3f8f; --sky-mid: #6a6fd0; --sky-low: #c3c6f2; }
.pixel-card.rarity-special { --sky-top: #b5530f; --sky-mid: #f0a429; --sky-low: #ffe58a; --num: #ffffff; }
/* ท้องฟ้าเป็นแถบสี (ไม่ไล่เนียน) + จุด dither ตรงรอยต่อ */
.pixel-art {
  position: relative; height: 150px; border: 3px solid var(--ink); outline: 2px solid #fff; outline-offset: -5px;
  image-rendering: pixelated;
  background:
    repeating-conic-gradient(var(--sky-mid) 0 25%, transparent 0 50%) 0 33% / 4px 4px repeat-x,
    repeating-conic-gradient(var(--sky-low) 0 25%, transparent 0 50%) 0 66% / 4px 4px repeat-x,
    linear-gradient(var(--sky-top) 0 33%, var(--sky-mid) 33% 66%, var(--sky-low) 66% 100%);
}
.pixel-num {
  position: absolute; top: 6px; left: 8px; font: 10px/1 "Press Start 2P", monospace; color: var(--ink);
  background: #fff; padding: 3px 4px; border: 2px solid var(--ink);
}
.pixel-big {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 34px/1 "Press Start 2P", monospace; color: var(--num);
  text-shadow: 3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink), 4px 4px 0 rgba(0, 0, 0, .35);
}
.pixel-label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .6rem .25rem .35rem; }
.pixel-en { font: 9px/1.4 "Press Start 2P", monospace; color: var(--ink); text-transform: uppercase; }
.pixel-card h3 { margin: 0 .25rem .25rem; font-size: 1.05rem; }
.pixel-card p { margin: 0 .25rem .5rem; font-size: .9rem; }
.pixel-card > .badge, .pixel-card > p:last-child { margin-left: .25rem; }
/* การ์ดที่มีรูป: แนวตั้งเต็มกว้าง ไม่เกิน 360px สูง */
.pixel-img { display: block; width: 100%; height: auto; max-height: 360px; object-fit: contain; background: #fff; border: 3px solid var(--ink); }
/* ตู้กาชา: แถบเลื่อนแนวนอน ทีละใบ (2026-10-26) */
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 4px 12px; margin: 0 -4px .75rem; scrollbar-width: thin; }
.carousel > * { flex: 0 0 72%; max-width: 260px; scroll-snap-align: center; margin-bottom: 0; }
.carousel:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
/* ร้าน: รูปเล็กด้านซ้าย รายละเอียดด้านขวา */
.shop-list .pixel-card { display: grid; grid-template-columns: 104px 1fr; column-gap: 10px; align-items: start; }
.shop-list .pixel-img { grid-row: 1 / span 8; max-height: none; }
.shop-list .pixel-label, .shop-list h3, .shop-list p { margin-left: 0; margin-right: 0; }
.shop-list .pixel-card > .badge, .shop-list .pixel-card > button { justify-self: start; margin: 0 0 .4rem; }
/* แบบสอบถาม: ข้อที่ส่งแล้ว (อ่านอย่างเดียว) */
.answered { display: block; padding: .6rem .75rem; margin-bottom: .75rem; border: 1px solid var(--line); border-radius: 10px; background: #f8faf8; }
.answered p { margin: .25rem 0 0; white-space: pre-wrap; }
/* ---- 2026-10-27: โปรไฟล์ / ผังห้อง ---- */
.profile-head { align-items: center; gap: 1rem; }
.avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid var(--line); flex: none; }
.empty-avatar { display: grid; place-items: center; background: #e6efe9; color: var(--primary); font-size: 2rem; font-weight: 700; }
.profile details { margin-top: .75rem; }
.board-label { text-align: center; padding: .4rem; margin-bottom: .5rem; background: #12261c; color: #f2f5f1; border-radius: 8px; font-weight: 600; }
.seat-grid { display: grid; gap: 6px; }
.seat { display: flex; flex-direction: column; gap: 2px; padding: 6px; border: 1px dashed var(--line); border-radius: 10px; background: #fafcfb; min-width: 0; cursor: pointer; }
.seat select { font-size: .8rem; padding: 2px; min-width: 0; }
.seat.taken { border-style: solid; background: #fff; }
.seat.moved { border: 2px solid #c25e00; }
.seat.focus { background: #fff4dc; border: 2px solid #12261c; }
.media-list { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
/* ห้องเรียน 8-bit (ทดลอง) */
.game-wrap { background: #12261c; padding: 6px; border-radius: 10px; }
.game-canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.game-hint { font-weight: 600; margin: .5rem 0; min-height: 1.5em; }
.game-pad { display: flex; align-items: center; justify-content: space-between; gap: 1rem; user-select: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
.pad { min-height: 52px; padding: 0; font-size: 1.2rem; touch-action: manipulation; }
.a-btn { width: 80px; height: 80px; border-radius: 50%; font-size: 1.6rem; font-family: "Press Start 2P", monospace; }

/* ครูทักนักเรียน (2026-10-27) */
.chat { display: grid; gap: .5rem; max-height: 55vh; overflow-y: auto; padding: .25rem 0 .5rem; }
.bubble { justify-self: start; max-width: 85%; padding: .5rem .75rem; border-radius: 14px 14px 14px 4px; background: #eef1ef; }
.bubble.me { justify-self: end; border-radius: 14px 14px 4px 14px; background: #dff3e5; }
.bubble p { margin: 0 0 .15rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .muted { font-size: .75rem; }
.thread-list { display: grid; gap: .5rem; }
.thread-list .thread { display: grid; justify-items: start; justify-content: stretch; gap: .2rem; text-align: left; width: 100%; }
.thread-list .thread.unread { border-color: #f0a429; box-shadow: inset 4px 0 #f0a429; }
.bottom-nav a { position: relative; }
.nav-dot { position: absolute; top: 2px; right: calc(50% - 20px); min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #d92d20; color: #fff; font-size: .68rem; font-weight: 700; line-height: 18px; text-align: center; }

/* โปรไฟล์ / AAR รายคน (2026-11-02) */
.student-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 1rem; }
.student-chips button { min-height: 40px; padding: .35rem .7rem; }
.student-chips button[aria-current] { background: #eaf7ee; color: #15552f; border-color: var(--primary); box-shadow: inset 0 -3px var(--primary); }
.aar-history { display: grid; gap: .75rem; margin-bottom: 1rem; }
.aar-card dl { display: grid; gap: .15rem .75rem; margin: .5rem 0 0; }
.aar-card dt { color: var(--muted); font-size: var(--fs-sm); margin-top: .35rem; }
.aar-card dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (min-width: 900px) { .aar-card dl { grid-template-columns: 14rem 1fr; } .aar-card dt { margin-top: 0; } }
